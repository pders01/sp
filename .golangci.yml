version: "2"
linters:
  enable:
    - bodyclose
    - dupl
    - gocritic
    - misspell
    - revive
  settings:
    dupl:
      threshold: 100
    gocritic:
      disabled-checks:
        - commentedOutCode
        - hugeParam
      enabled-tags:
        - performance
        - style
        - experimental
    govet:
      enable:
        - shadow
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
