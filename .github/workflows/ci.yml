name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  embedded-vim-compat:
    name: Embedded Vim source and packaged assets
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned build/test dependencies
      run: npm --prefix scripts/embedded-vim ci --ignore-scripts --no-audit --no-fund
    - name: Headless command compatibility
      run: npm --prefix scripts/embedded-vim test
    - name: Verify packaged guest is reproducible
      run: |
        node scripts/embedded-vim/build-bundle.js internal/embeddedvim/assets
        git diff --exit-code -- internal/embeddedvim/assets/guest.js internal/embeddedvim/assets/manifest.json

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Codecov OIDC; no long-lived upload secret.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Run unit tests and race detector
      run: go test -v -race '-coverprofile=coverage.out' ./...
    - name: Test cancellation dependency lifecycle
      run: go test -race github.com/muesli/cancelreader
    - name: Repeat Linux terminal cancellation race regression
      if: runner.os == 'Linux'
      run: go test -race -count=100 -run '^TestTerminalStreamCancellationRetainsCallerFile$' ./internal/tui
    - name: Private terminal integration (synthetic stores only)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        mkdir -p .privacy-adversarial
        go build -o .privacy-adversarial/sp-validation ./cmd/sp
        python3 scripts/privacy-terminal/main.py --binary .privacy-adversarial/sp-validation
    - name: Passphrase-change terminal integration (synthetic stores only)
      if: runner.os != 'Windows'
      shell: bash
      run: make key-terminal
    - name: Bounded privacy fuzz checks
      if: runner.os == 'Linux'
      shell: bash
      env:
        GOMAXPROCS: '2'
      run: |
        for target in FuzzDecodeRecord FuzzStrictJSONCanonicalRoundtrip FuzzAppendBullets FuzzValidateAgeEnvelope FuzzDecodePrivateDocumentFollowup; do
          go test ./internal/scratchpad -run='^$' -fuzz="^${target}$" -fuzztime=5s -parallel=2
        done
    - name: Upload coverage to Codecov
      if: runner.os == 'Linux'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.out
        disable_search: true
        use_oidc: true
        flags: unittests
        name: codecov-umbrella

  vulnerabilities:
    name: Reachable dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Validate release tooling (synthetic fixtures; no publication)
      run: make test-release
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.5.0
        args: --timeout=5m ./...

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Build (Unix)
      if: runner.os != 'Windows'
      run: go build -v -o sp ./cmd/sp
    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: go build -v -o sp.exe ./cmd/sp
    - name: Upload artifact (Unix)
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: sp-${{ matrix.os }}
        path: sp
    - name: Upload artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: sp-${{ matrix.os }}
        path: sp.exe
